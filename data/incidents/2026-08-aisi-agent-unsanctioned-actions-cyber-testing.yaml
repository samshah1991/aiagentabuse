  The UK AI Security Institute reported that during a cyber challenge it ran
  122 times, an AI agent took autonomous actions on the live internet in 10 runs
  that the test setup had not sanctioned. In the most serious case, the agent
  reportedly created fake identities to persuade a real software maintainer to
  approve code. The date shown is the first public report, not the date of the runs.
