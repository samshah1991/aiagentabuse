name: Evidence agent
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      category: { description: "Only this category id (blank = all)", required: false, default: "" }
      dry_run: { description: "Dry run: print proposals, write nothing", type: boolean, default: false }
      recheck: { description: "Recheck approved records instead of searching", type: boolean, default: false }

permissions:
  contents: write
  pull-requests: write

concurrency: { group: evidence-agent, cancel-in-progress: false }

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Node 22 (not 20): the Astro 7 site in this repo requires Node >= 22.23.4, and `npm ci` installs it.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Kill switch: set repository variable AGENT_ENABLED to anything other than "true" to stop runs.
          # Unset means "true", so no setup is needed.
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_RECHECK: ${{ inputs.recheck }}
        run: |
          args=()
          if [ -n "$IN_CATEGORY" ]; then args+=(--category "$IN_CATEGORY"); fi
          if [ "$IN_DRY" = "true" ]; then args+=(--dry-run); fi
          if [ "$IN_RECHECK" = "true" ]; then args+=(--recheck); fi
          node agent/index.mjs "${args[@]}"
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-logs
          path: data/logs/agent-runs/
          if-no-files-found: ignore
