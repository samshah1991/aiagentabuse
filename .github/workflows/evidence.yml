name: Evidence agent
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      category: { description: "Only this category id (blank = all)", required: false, default: "" }
      recheck: { description: "Only re-check existing source links (no model calls)", type: boolean, default: false }
      dry_run: { description: "Dry run: no files, branch or PR", type: boolean, default: false }

permissions:
  contents: write       # push the agent/* branch
  pull-requests: write  # open the PR

concurrency: { group: evidence-agent, cancel-in-progress: false }

jobs:
  evidence:
    # Kill switch: set repository variable AGENT_KILL_SWITCH=on to stop all runs.
    if: ${{ vars.AGENT_KILL_SWITCH != 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AGENT_KILL_SWITCH: ${{ vars.AGENT_KILL_SWITCH }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_RECHECK: ${{ inputs.recheck }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          args=()
          [ -n "$IN_CATEGORY" ] && args+=(--category "$IN_CATEGORY")
          [ "$IN_RECHECK" = "true" ] && args+=(--recheck)
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          node agent/index.mjs "${args[@]}"
